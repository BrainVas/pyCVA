[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyCVA"
version = "0.1.0"
description = "Package that consolidates multiple tools related to stoke research and analysis"
authors = [
    { name = "James Boogaard" },
    { name = "Dr Su Ruisheng" }
]
readme = "README.md"
requires-python = "==3.11"
license = { text = "MIT" }
dependencies = [
    "alabaster==1.0.0",
    "antspyx==0.5.4",
    "anyio==4.9.0",
    "babel==2.17.0",
    "certifi==2025.6.15",
    "charset-normalizer==3.4.2",
    "click==8.2.1",
    "colorama==0.4.6",
    "contourpy==1.3.2",
    "cycler==0.12.1",
    "docutils==0.21.2",
    "e==1.4.5",
    "fonttools==4.58.4",
    "h11==0.16.0",
    "idna==3.10",
    "imageio==2.37.0",
    "imagesize==1.4.1",
    "Jinja2==3.1.6",
    "kiwisolver==1.4.8",
    "lazy_loader==0.4",
    "MarkupSafe==3.0.2",
    "matplotlib==3.10.3",
    "natsort==8.4.0",
    "networkx==3.5",
    "nibabel==4.0.2",
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "packaging==25.0",
    "pandas==2.3.0",
    "patsy==1.0.1",
    "pillow==11.2.1",
    "pydicom==3.0.1",
    "Pygments==2.19.2",
    "pyparsing==3.2.3",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "PyYAML==6.0.2",
    "requests==2.32.4",
    "roman-numerals-py==3.1.0",
    "scikit-image==0.25.2",
    "scipy==1.16.0",
    "SimpleITK==2.5.0",
    "SimpleITK-SimpleElastix==2.0.0rc2.dev910",
    "six==1.17.0",
    "sniffio==1.3.1",
    "snowballstemmer==3.0.1",
    "Sphinx==8.2.3",
    "sphinx-autobuild==2024.10.3",
    "sphinxcontrib-applehelp==2.0.0",
    "sphinxcontrib-devhelp==2.0.0",
    "sphinxcontrib-htmlhelp==2.1.0",
    "sphinxcontrib-jsmath==1.0.1",
    "sphinxcontrib-qthelp==2.0.0",
    "sphinxcontrib-serializinghtml==2.0.0",
    "starlette==0.47.1",
    "statsmodels==0.14.4",
    "tifffile==2025.6.11",
    "tqdm==4.67.1",
    "typing_extensions==4.14.0",
    "tzdata==2025.2",
    "urllib3==2.5.0",
    "uvicorn==0.35.0",
    "watchfiles==1.1.0",
    "webcolors==24.11.1",
    "websockets==15.0.1"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
